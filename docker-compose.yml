version: '3'

services:

  sulfides_backend:
    image: 'descriptor-backend:latest'
    environment:
      POSTGRES_SERVER: descriptor_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWD: "${POSTGRES_PASSWD:?is not set, expected from ../.env.secrets via the .env link in this folder}"
      POSTGRES_DB: sulfides_data
      API_PREFIX: sulfides
    entrypoint: bash prestart.sh
    networks:
      - external_network
      - descriptor-libraries-internal
    labels:
      - traefik.enable=true
      - traefik.http.services.descriptor_libraries-sulfides_backend.loadbalancer.server.port=8080
      - "traefik.http.routers.descriptor_libraries-sulfides_backend.rule=(Host(`descriptor-libraries.molssi.org`) && PathPrefix(`/api/sulfides`))"
      - traefik.http.routers.descriptor_libraries-sulfides_backend.entrypoints=websecure
      - traefik.http.routers.descriptor_libraries-sulfides_backend.tls.certresolver=letsencrypt

  sulfides_frontend:
    image: 'descriptor-frontend-alpine:latest'
    volumes:
      - "./public:/app/public"
    environment:
      - VITE_BASE_URL=/sulfides
    networks:
      - external_network
    entrypoint: ash renameBase.sh
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.descriptor_libraries-frontend-sulfides.rule=(Host(`descriptor-libraries.molssi.org`) && PathPrefix(`/sulfides`))"
      - "traefik.http.services.descriptor_libraries-frontend-sulfides.loadbalancer.server.port=3000"
      - traefik.http.routers.descriptor_libraries-frontend-sulfides.entrypoints=websecure
      - traefik.http.routers.descriptor_libraries-frontend-sulfides.tls.certresolver=letsencrypt

networks:
  external_network:
    name: docker_main_net
    external: true
  descriptor-libraries-internal:
    external: true
